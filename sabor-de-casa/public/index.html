<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabor de Casa – Cardápio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f3ee; --surface:#ffffff; --ink:#1e2b27; --muted:#5f6d67; --line:#d9ded6;
  --green:#1f4d3f; --green-ink:#ffffff; --tag:#f0b429; --tag-ink:#2b2000; --off:#b42318; --off-bg:#fdecea;
  --head:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Figtree","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a17; --surface:#1d2622; --ink:#eef2ec; --muted:#9aa8a1; --line:#2f3b36;
    --green:#4fa386; --green-ink:#06130e; --tag:#f0b429; --tag-ink:#2b2000; --off:#ff8a7c; --off-bg:#3a1f1c;
  }
}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1d2622; --ink:#eef2ec; --muted:#9aa8a1; --line:#2f3b36;
  --green:#4fa386; --green-ink:#06130e; --off:#ff8a7c; --off-bg:#3a1f1c;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}

.top{background:var(--green);color:var(--green-ink);padding:20px clamp(16px,4vw,40px);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top h1{font:800 clamp(1.5rem,3vw,2rem)/1.1 var(--head);margin:0}
.top p{margin:2px 0 0;opacity:.85;font-size:.95rem}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn-main{background:var(--tag);color:var(--tag-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:transparent;border:1px solid var(--line);color:var(--off)}

.wrap{max-width:760px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 60px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font:800 1.5rem/1.2 var(--head);margin:0}
.bar p{margin:2px 0 0;color:var(--muted)}
.back{background:none;border:0;padding:0;margin-bottom:10px;color:var(--muted);font-weight:600;cursor:pointer;min-height:44px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.card.off{background:var(--off-bg)}
.card.off .name{text-decoration:line-through;text-decoration-thickness:2px}
.name{font:600 1.1rem/1.3 var(--head);margin:0}
.desc{margin:2px 0 0;color:var(--muted);font-size:.95rem;max-width:52ch}
.price{background:var(--tag);color:var(--tag-ink);font:800 1.15rem/1 var(--head);padding:9px 14px 9px 20px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);white-space:nowrap}
.card.off .price{background:var(--line);color:var(--muted)}
.count{color:var(--muted);font-weight:600}
.actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.spacer{flex:1}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:transparent;border:1px solid var(--line);color:var(--off)}
.btn-main{background:var(--tag);color:var(--tag-ink)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;min-height:44px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{width:46px;height:26px;border-radius:99px;background:var(--off);position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:3px solid var(--tag);outline-offset:2px}
.empty{border:2px dashed var(--line);border-radius:12px;padding:32px;text-align:center;color:var(--muted)}
.alert{background:var(--off-bg);color:var(--off);border:1px solid var(--off);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-weight:600}
.alert:empty{display:none}
form.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:16px}
label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
label input,label select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;font-weight:400}
label input[aria-invalid="true"]{border-color:var(--off);border-width:2px}
.err{color:var(--off);font-weight:600;font-size:.9rem;min-height:0}
.err:empty{display:none}
.hint{color:var(--muted);font-weight:400;font-size:.9rem}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.track,.track::after{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Sabor de Casa</h1>
    <p>Cardápio do dia: o que você muda aqui vale para todos os pedidos.</p>
  </div>
</header>

<main class="wrap">
  <div class="alert" id="aviso" role="alert"></div>

  <!-- 1. Lista de categorias -->
  <section id="v-cats" aria-labelledby="t-cats">
    <div class="bar">
      <div><h2 id="t-cats">Categorias</h2><p>Escolha uma categoria para ver os pratos.</p></div>
      <button class="btn btn-main" data-go="cat-form">Nova categoria</button>
    </div>
    <ul class="list" id="lista-cats"></ul>
  </section>

  <!-- 2. Cadastro/edição de categoria -->
  <section id="v-catform" hidden aria-labelledby="t-catform">
    <button class="back" data-go="cats">← Voltar às categorias</button>
    <div class="bar"><h2 id="t-catform"></h2></div>
    <form class="panel" id="f-cat" novalidate>
      <label>Nome da categoria
        <input id="c-nome" maxlength="60" autocomplete="off" aria-describedby="e-cnome">
        <span class="err" id="e-cnome"></span>
      </label>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-go="cats">Cancelar</button>
        <button type="submit" class="btn btn-main">Salvar categoria</button>
      </div>
    </form>
  </section>

  <!-- 3. Lista de pratos da categoria -->
  <section id="v-pratos" hidden aria-labelledby="t-pratos">
    <button class="back" data-go="cats">← Voltar às categorias</button>
    <div class="bar">
      <div><h2 id="t-pratos"></h2><p id="r-pratos"></p></div>
      <button class="btn btn-main" data-go="prato-form">Novo prato</button>
    </div>
    <ul class="list" id="lista-pratos"></ul>
  </section>

  <!-- 4. Cadastro/edição de prato -->
  <section id="v-pratoform" hidden aria-labelledby="t-pratoform">
    <button class="back" data-go="pratos">← Voltar aos pratos</button>
    <div class="bar"><h2 id="t-pratoform"></h2></div>
    <form class="panel" id="f-prato" novalidate>
      <label>Nome do prato
        <input id="p-nome" maxlength="80" autocomplete="off" aria-describedby="e-pnome">
        <span class="err" id="e-pnome"></span>
      </label>
      <label>Descrição <span class="hint">(opcional)</span>
        <input id="p-desc" maxlength="200" placeholder="Ex.: arroz, feijão, bife acebolado" aria-describedby="e-pdesc">
        <span class="err" id="e-pdesc"></span>
      </label>
      <label>Preço (R$)
        <input id="p-preco" type="number" step="0.01" inputmode="decimal" aria-describedby="e-ppreco">
        <span class="err" id="e-ppreco"></span>
      </label>
      <label>Categoria
        <select id="p-cat" aria-describedby="e-pcat"></select>
        <span class="err" id="e-pcat"></span>
      </label>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-go="pratos">Cancelar</button>
        <button type="submit" class="btn btn-main">Salvar prato</button>
      </div>
    </form>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const views = {cats:"v-cats","cat-form":"v-catform",pratos:"v-pratos","prato-form":"v-pratoform"};
let cats = [], pratos = [], catAtual = null, editCat = null, editPrato = null;

/* ---- Cliente da API ---- */
async function api(metodo, url, body){
  let r;
  try{
    r = await fetch(url, {method:metodo, headers: body ? {"Content-Type":"application/json"} : undefined,
                          body: body ? JSON.stringify(body) : undefined});
  }catch{ throw {erro:"Não foi possível falar com o servidor. Confira se ele está rodando.", campos:{}}; }
  const dados = r.status === 204 ? null : await r.json().catch(() => null);
  if(!r.ok) throw dados || {erro:"Erro inesperado no servidor.", campos:{}};
  return dados;
}
const Categorias = {
  listar:()=>api("GET","/api/categorias"),
  criar:d=>api("POST","/api/categorias",d),
  atualizar:(id,d)=>api("PUT","/api/categorias/"+id,d),
  excluir:id=>api("DELETE","/api/categorias/"+id)
};
const Pratos = {
  listar:cat=>api("GET","/api/pratos?categoria_id="+cat),
  criar:d=>api("POST","/api/pratos",d),
  atualizar:(id,d)=>api("PUT","/api/pratos/"+id,d),
  excluir:id=>api("DELETE","/api/pratos/"+id)
};

/* ---- Utilitários de tela ---- */
function aviso(msg){ $("aviso").textContent = msg || ""; }
function erro(campo, errId, msg){
  $(errId).textContent = msg || "";
  if(msg) campo.setAttribute("aria-invalid","true"); else campo.removeAttribute("aria-invalid");
}
function show(name){
  Object.values(views).forEach(id => $(id).hidden = true);
  $(views[name]).hidden = false;
  window.scrollTo(0,0);
}

/* ---- 1. Lista de categorias ---- */
async function listaCats(msg){
  aviso();
  try{ cats = await Categorias.listar(); }catch(e){ cats = []; msg = e.erro; }
  $("lista-cats").innerHTML = cats.length ? cats.map(c => {
    const n = c.total_pratos;
    return `<li class="card">
      <div><p class="name">${esc(c.nome)}</p><span class="count">${n} ${n===1?"prato":"pratos"}</span></div>
      <button class="btn btn-main" data-ver="${c.id}">Ver pratos</button>
      <div class="actions"><span class="spacer"></span>
        <button class="btn btn-ghost" data-edit-cat="${c.id}">Editar</button>
        <button class="btn btn-danger" data-del-cat="${c.id}">Excluir</button>
      </div></li>`;
  }).join("") : `<li class="empty">Nenhuma categoria ainda. Use “Nova categoria” para começar.</li>`;
  show("cats"); aviso(msg);
}

/* ---- 2. Cadastro/edição de categoria ---- */
function formCat(c){
  aviso(); editCat = c || null;
  $("t-catform").textContent = c ? "Editar categoria" : "Nova categoria";
  $("c-nome").value = c ? c.nome : "";
  erro($("c-nome"),"e-cnome");
  show("cat-form"); $("c-nome").focus();
}

/* ---- 3. Lista de pratos da categoria ---- */
async function listaPratos(msg){
  aviso();
  const cat = cats.find(c => c.id === catAtual);
  try{ pratos = await Pratos.listar(catAtual); }catch(e){ pratos = []; msg = e.erro; }
  const ativos = pratos.filter(p => p.disponivel).length;
  $("t-pratos").textContent = cat.nome;
  $("r-pratos").textContent = pratos.length ? `${ativos} de ${pratos.length} pratos disponíveis` : "";
  $("lista-pratos").innerHTML = pratos.length ? pratos.map(p => `
    <li class="card ${p.disponivel?"":"off"}">
      <div><p class="name">${esc(p.nome)}</p>${p.descricao?`<p class="desc">${esc(p.descricao)}</p>`:""}</div>
      <span class="price">${brl(p.preco)}</span>
      <div class="actions">
        <label class="switch"><input type="checkbox" data-toggle="${p.id}" ${p.disponivel?"checked":""}>
          <span class="track"></span><span>${p.disponivel?"Disponível":"Esgotado"}</span></label>
        <span class="spacer"></span>
        <button class="btn btn-ghost" data-edit-prato="${p.id}">Editar</button>
        <button class="btn btn-danger" data-del-prato="${p.id}">Excluir</button>
      </div></li>`).join("")
    : `<li class="empty">Nenhum prato em ${esc(cat.nome)}. Use “Novo prato” para cadastrar o primeiro.</li>`;
  show("pratos"); aviso(msg);
}

/* ---- 4. Cadastro/edição de prato ---- */
function formPrato(p){
  aviso(); editPrato = p || null;
  $("t-pratoform").textContent = p ? "Editar prato" : "Novo prato";
  $("p-cat").innerHTML = '<option value="">Selecione…</option>' + cats.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join("");
  $("p-nome").value = p ? p.nome : "";
  $("p-desc").value = p ? p.descricao : "";
  $("p-preco").value = p ? p.preco : "";
  $("p-cat").value = p ? p.categoria_id : catAtual;
  [["p-nome","e-pnome"],["p-desc","e-pdesc"],["p-preco","e-ppreco"],["p-cat","e-pcat"]].forEach(([i,e]) => erro($(i),e));
  show("prato-form"); $("p-nome").focus();
}

/* ---- Eventos ---- */
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.go === "cats") listaCats();
  if(d.go === "cat-form") formCat();
  if(d.go === "pratos") listaPratos();
  if(d.go === "prato-form") formPrato();
  if(d.ver){ catAtual = +d.ver; listaPratos(); }
  if(d.editCat) formCat(cats.find(c => c.id === +d.editCat));
  if(d.editPrato) formPrato(pratos.find(p => p.id === +d.editPrato));
  if(d.delCat){
    const c = cats.find(c => c.id === +d.delCat);
    if(c.total_pratos === 0 && !confirm(`Excluir a categoria “${c.nome}”?`)) return;
    try{ await Categorias.excluir(c.id); listaCats(); }catch(err){ listaCats(err.erro); }
  }
  if(d.delPrato){
    const p = pratos.find(p => p.id === +d.delPrato);
    if(!confirm(`Excluir o prato “${p.nome}”?`)) return;
    try{ await Pratos.excluir(p.id); listaPratos(); }catch(err){ listaPratos(err.erro); }
  }
});

document.addEventListener("change", async e => {
  if(!e.target.dataset.toggle) return;
  try{ await Pratos.atualizar(+e.target.dataset.toggle, {disponivel:e.target.checked}); listaPratos(); }
  catch(err){ listaPratos(err.erro); }
});

$("f-cat").addEventListener("submit", async e => {
  e.preventDefault();
  const body = {nome:$("c-nome").value};
  const btn = e.submitter; btn.disabled = true;
  try{
    if(editCat) await Categorias.atualizar(editCat.id, body); else await Categorias.criar(body);
    listaCats();
  }catch(err){
    const msg = (err.campos || {}).nome;
    erro($("c-nome"),"e-cnome",msg);
    if(msg) $("c-nome").focus(); else aviso(err.erro);
  }finally{ btn.disabled = false; }
});

$("f-prato").addEventListener("submit", async e => {
  e.preventDefault();
  const body = {
    nome:$("p-nome").value, descricao:$("p-desc").value,
    preco: $("p-preco").value === "" ? null : Number($("p-preco").value),
    categoria_id: $("p-cat").value === "" ? null : Number($("p-cat").value)
  };
  const btn = e.submitter; btn.disabled = true;
  try{
    if(editPrato) await Pratos.atualizar(editPrato.id, body); else await Pratos.criar(body);
    catAtual = body.categoria_id; listaPratos();
  }catch(err){
    const c = err.campos || {};
    erro($("p-nome"),"e-pnome",c.nome);
    erro($("p-preco"),"e-ppreco",c.preco);
    erro($("p-cat"),"e-pcat",c.categoria_id);
    erro($("p-desc"),"e-pdesc",c.descricao);
    const primeiro = c.nome ? "p-nome" : c.preco ? "p-preco" : c.categoria_id ? "p-cat" : c.descricao ? "p-desc" : null;
    if(primeiro) $(primeiro).focus(); else aviso(err.erro);
  }finally{ btn.disabled = false; }
});

listaCats();
</script>
</body>
</html>
